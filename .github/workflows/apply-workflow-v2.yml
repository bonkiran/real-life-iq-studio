name: Apply Studio workflow V2

on:
  push:
    branches: [main]
    paths:
      - .github/WORKFLOW_V2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put publishing plan before final video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''PIPELINE = [
              ("problem", "Problem Definition"),
              ("slides", "Slides Verification"),
              ("voice", "Voice-over Verification"),
              ("final_video", "Final Video"),
              ("publishing", "Title / Description / Hashtags"),
              ("published", "Published"),
              ("metrics", "Metrics"),
          ]'''.replace('          ', '')
          new = '''PIPELINE = [
              ("problem", "Problem Definition"),
              ("slides", "Slides Verification"),
              ("voice", "Voice-over Verification"),
              ("publishing", "Publishing Plan"),
              ("final_video", "Final Video"),
              ("published", "Published"),
              ("metrics", "Metrics"),
          ]'''.replace('          ', '')
          if old not in s:
              raise SystemExit('Expected PIPELINE block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit workflow V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Move publishing plan before final video"
          git push
