name: Apply Studio authentication hook

on:
  push:
    branches: [main]
    paths:
      - .github/AUTH_PATCH

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app authentication hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          import_line = 'from fastapi.templating import Jinja2Templates\n'
          if 'from security import install_auth\n' not in s:
              s = s.replace(import_line, import_line + 'from security import install_auth\n')
          anchor = 'templates = Jinja2Templates(directory=BASE_DIR / "templates")\n'
          if 'install_auth(app, templates)' not in s:
              s = s.replace(anchor, anchor + 'install_auth(app, templates)\n')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit authentication hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enable Studio login protection"
          git push
