name: Expand REAL-LIFE IQ Studio source

on:
  push:
    branches: [main]
    paths:
      - source_parts/READY

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebuild and expand source archive
        run: |
          cat source_parts/part01.txt source_parts/part02.txt source_parts/part03.txt source_parts/part04.txt source_parts/part05.txt source_parts/part06a.txt source_parts/part06b.txt source_parts/part07.txt source_parts/part08.txt | base64 -d > studio_source_rebuilt.zip
          unzip -o studio_source_rebuilt.zip -d .
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt render.yaml .gitignore static templates seed README.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand REAL-LIFE IQ Content Studio source"
          git push
