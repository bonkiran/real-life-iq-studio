name: Apply YouTube tags field

on:
  push:
    branches: [main]
    paths:
      - .github/YOUTUBE_TAGS_PATCH

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add YouTube tags field support
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old_sig = '''def update_video(video_id:int, topic:str=Form(""), title:str=Form(""), description:str=Form(""), hashtags:str=Form(""), status:str=Form("Planning"), problem:str=Form(""), takeaway:str=Form(""), upload_date:str=Form(""), publish_date:str=Form(""), youtube_url:str=Form(""), pinned_comment:str=Form(""), notes:str=Form("")):'''
          new_sig = '''def update_video(video_id:int, topic:str=Form(""), title:str=Form(""), description:str=Form(""), hashtags:str=Form(""), youtube_tags:str=Form(""), status:str=Form("Planning"), problem:str=Form(""), takeaway:str=Form(""), upload_date:str=Form(""), publish_date:str=Form(""), youtube_url:str=Form(""), pinned_comment:str=Form(""), notes:str=Form("")):'''
          if old_sig not in s:
              raise SystemExit('update_video signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_fields = '''fields=[topic,title,description,hashtags,status,problem,takeaway,upload_date,publish_date,youtube_url,pinned_comment,notes]; vals=[x.strip() or None for x in fields]; now=datetime.now().isoformat(timespec="seconds")'''
          new_fields = '''fields=[topic,title,description,hashtags,youtube_tags,status,problem,takeaway,upload_date,publish_date,youtube_url,pinned_comment,notes]; vals=[x.strip() or None for x in fields]; now=datetime.now().isoformat(timespec="seconds")'''
          if old_fields not in s:
              raise SystemExit('fields list not found')
          s = s.replace(old_fields, new_fields, 1)
          old_sql = '''con=db_connect(); con.execute("UPDATE videos SET topic=?,title=?,description=?,hashtags=?,status=?,problem=?,takeaway=?,upload_date=?,publish_date=?,youtube_url=?,pinned_comment=?,notes=?,updated_at=? WHERE id=?",(*vals,now,video_id)); con.commit(); con.close(); return RedirectResponse(url=f"/videos/{video_id}",status_code=303)'''
          new_sql = '''con=db_connect(); con.execute("UPDATE videos SET topic=?,title=?,description=?,hashtags=?,youtube_tags=?,status=?,problem=?,takeaway=?,upload_date=?,publish_date=?,youtube_url=?,pinned_comment=?,notes=?,updated_at=? WHERE id=?",(*vals,now,video_id)); con.commit(); con.close(); return RedirectResponse(url=f"/videos/{video_id}",status_code=303)'''
          if old_sql not in s:
              raise SystemExit('update SQL not found')
          s = s.replace(old_sql, new_sql, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Support YouTube tags in video records"
          git push
