name: Fix Video 5 description

on:
  push:
    branches: [main]
    paths:
      - .github/FIX_V5_DESCRIPTION

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync final Video 5 description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio_sync.py')
          s = p.read_text(encoding='utf-8')
          old = '''    description5 = """Has your WhatsApp account been taken over?\n\nHere’s what to do first:\n\n✅ Open WhatsApp and re-register your phone number\n\n✅ Enter the new 6-digit verification code\n\n✅ Check Linked Devices and remove anything suspicious\n\n✅ Enable two-step verification\n\n✅ Warn your contacts that your account was compromised\n\nAct quickly to regain control and protect your account.\n\nREAL-LIFE IQ — Smarter Choices for Real Life."""'''
          new = '''    description5 = """Has your WhatsApp account been taken over?\n\nIf you still control your phone number, you may be able to reclaim your account by re-registering that same number in WhatsApp.\n\nHere’s what to do:\n\n✅ Open WhatsApp and enter your phone number again\n✅ Enter the new 6-digit verification code\n✅ This re-registers the account and logs the attacker out\n✅ If you can’t receive texts or calls, contact your mobile carrier first\n✅ Check Linked Devices and remove anything unfamiliar\n✅ Turn on two-step verification\n✅ Warn your contacts that your account was compromised\n\nAct fast, reclaim it, and secure it.\n\nREAL-LIFE IQ — Smarter Choices for Real Life."""'''
          if old not in s:
              raise SystemExit('Video 5 description block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit description
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio_sync.py
          git commit -m "Sync final Video 5 description"
          git push
