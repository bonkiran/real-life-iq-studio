name: Apply WhatsApp series update

on:
  push:
    branches: [main]
    paths:
      - .github/WHATSAPP_SERIES_PATCH

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire WhatsApp series sync into app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          import_anchor = 'from security import install_auth\n'
          sync_import = 'from studio_sync import sync_whatsapp_series\n'
          if sync_import not in s:
              s = s.replace(import_anchor, import_anchor + sync_import)
          if 'sync_whatsapp_series(db_connect, ensure_stages)' not in s:
              s = s.replace('\ninit_db()\n', '\ninit_db()\nsync_whatsapp_series(db_connect, ensure_stages)\n')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit WhatsApp series update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire WhatsApp two-part series into Studio"
          git push
