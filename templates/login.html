<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · REAL-LIFE IQ Studio</title>
  <style>
    :root{--navy:#102a43;--blue:#163a5f;--gold:#f2b84b;--muted:#9fb5c8;--white:#fff;--line:#2a4d69}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#163a5f 0,#102a43 42%,#081a2b 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#edf5fb}
    .shell{width:min(430px,92vw)}.brand{display:flex;align-items:center;gap:13px;margin:0 0 18px}.bulb{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:18px;letter-spacing:.03em}.brand span{display:block;color:#b9cad8;font-size:13px;margin-top:3px}
    .card{background:rgba(9,25,40,.78);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.35)}h1{font-size:24px;margin:0 0 7px}.sub{margin:0 0 22px;color:#a9bed1;font-size:14px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;color:#c9d8e4;margin:0 0 14px}input{width:100%;margin-top:6px;padding:12px 13px;border-radius:9px;border:1px solid #355873;background:#0d2235;color:#fff;font:inherit;outline:none}input:focus{border-color:#6da5d0;box-shadow:0 0 0 3px rgba(109,165,208,.15)}button{width:100%;border:0;border-radius:9px;padding:12px 14px;background:#f2b84b;color:#102a43;font-weight:800;font:inherit;cursor:pointer;margin-top:4px}.error{background:#4d2222;border:1px solid #7f3b3b;color:#ffdada;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:15px}.note{margin-top:16px;text-align:center;color:#7890a4;font-size:11px}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand"><div class="bulb">◉</div><div><strong>REAL-LIFE IQ</strong><span>Content Studio</span></div></div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Private production workspace for ideas, approvals, assets and publishing.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username<input name="username" autocomplete="username" value="{{ username }}" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" autofocus required></label>
        <button type="submit">Enter Content Studio</button>
      </form>
    </div>
    <div class="note">REAL-LIFE IQ · Safety-first production system</div>
  </div>
</body>
</html>
